name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node 24 and run checks without production credentials
        run: npx --yes --package=node@24.10.0 --package=npm@11.9.0 -c 'node --version && npm ci --no-audit --no-fund && npm run check'
